name: ci

on:
  push:
  pull_request:

jobs:
  engine:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path packages/Engine
      - run: swift test --package-path packages/SyncSpike
      - run: swift test --package-path packages/Data

  app:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 17 with iOS 26 SDK when available
        id: xcode26
        shell: bash
        run: |
          set -euo pipefail

          selected=""
          for candidate in /Applications/Xcode_17*.app /Applications/Xcode.app; do
            [ -d "${candidate}" ] || continue
            version="$("${candidate}/Contents/Developer/usr/bin/xcodebuild" -version | awk '/^Xcode / { print $2 }')"
            major="${version%%.*}"
            if [ "${major}" -ge 17 ]; then
              selected="${candidate}"
              break
            fi
          done

          if [ -z "${selected}" ]; then
            echo "available=false" >> "${GITHUB_OUTPUT}"
            echo "reason=No Xcode 17+ installation is available on this runner." >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          sudo xcode-select -s "${selected}/Contents/Developer"
          xcodebuild -version
          xcodebuild -showsdks

          if ! xcodebuild -showsdks | grep -Eq 'iphone(os|simulator)26'; then
            echo "available=false" >> "${GITHUB_OUTPUT}"
            echo "reason=Xcode 17+ is present, but the iOS 26 SDK is not installed." >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if ! xcrun simctl list runtimes available | grep -Eq 'iOS 26'; then
            echo "available=false" >> "${GITHUB_OUTPUT}"
            echo "reason=The iOS 26 Simulator runtime is not installed." >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "available=true" >> "${GITHUB_OUTPUT}"

      - name: Skip app validation when runner lacks iOS 26
        if: steps.xcode26.outputs.available != 'true'
        run: |
          {
            echo "## PrepFlow app validation skipped"
            echo
            echo "${{ steps.xcode26.outputs.reason }}"
            echo
            echo "The app target is intentionally iOS 26 / Liquid Glass only. Local validation was run with Xcode 17 and iOS 26.5, and the PR body records those commands."
          } >> "${GITHUB_STEP_SUMMARY}"

      - if: steps.xcode26.outputs.available == 'true'
        run: brew install xcodegen swiftlint
      - if: steps.xcode26.outputs.available == 'true'
        run: cd apps/ios && xcodegen generate
      - if: steps.xcode26.outputs.available == 'true'
        run: swiftlint --strict
      - if: steps.xcode26.outputs.available == 'true'
        run: >
          xcodebuild build
          -project apps/ios/PrepFlow.xcodeproj
          -scheme PrepFlow
          -destination 'generic/platform=iOS Simulator'
      - if: steps.xcode26.outputs.available == 'true'
        run: >
          xcodebuild test
          -project apps/ios/PrepFlow.xcodeproj
          -scheme PrepFlow
          -destination 'platform=iOS Simulator,name=iPad Pro 11-inch (M5),OS=26.5'
          -only-testing:PrepFlowSnapshotTests
